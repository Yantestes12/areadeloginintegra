<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTEGRA - Painel de Controle Central</title>
    <!-- Favicon & Ícone da Aba -->
    <link rel="icon" type="image/png" href="logo_integra.png">
    <link rel="shortcut icon" type="image/png" href="logo_integra.png">
    <link rel="apple-touch-icon" href="logo_integra.png">

    <!-- Meta Tags para Pré-visualização do Link no WhatsApp, Telegram e Redes Sociais -->
    <meta name="description" content="INTEGRA - Conectando atletas, projetos e comunidades em uma plataforma integrada de alta performance.">
    <meta property="og:title" content="INTEGRA - Plataforma Unificada de Gestão">
    <meta property="og:description" content="Conectando atletas, projetos e comunidades em uma plataforma integrada de alta performance.">
    <meta property="og:image" content="https://portalintegra.com.br/logo_integra.png">
    <meta property="og:url" content="https://portalintegra.com.br/login">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="INTEGRA - Plataforma Unificada de Gestão">
    <meta name="twitter:description" content="Conectando atletas, projetos e comunidades em uma plataforma integrada de alta performance.">
    <meta name="twitter:image" content="https://portalintegra.com.br/logo_integra.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #060a13;
            display: flex;
        }

        /* Área do Fundo Técnico (Lado Esquerdo no PC) */
        .visual-side {
            flex: 1.25;
            position: relative;
            height: 100%;
            background: #080f1e;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #aurora-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Slogan Discreto no Fundo */
        .visual-overlay-text {
            position: relative;
            z-index: 2;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            padding: 40px;
            pointer-events: none;
        }

        .visual-overlay-text h2 {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 12px;
            text-shadow: 0 4px 24px rgba(0,0,0,0.55);
        }

        .visual-overlay-text p {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.65);
            max-width: 420px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Lado Direito: Coluna de Login Sólida */
        .login-side {
            width: 460px;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 45px;
            position: relative;
            z-index: 10;
            box-shadow: -15px 0 50px rgba(0, 0, 0, 0.25);
            border-left: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* Bloco da Identidade Visual no Formulário */
        .brand-header {
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-logo {
            height: 105px;
            width: auto;
            margin-top: 15px;
            margin-bottom: -4px;
            filter: drop-shadow(0 6px 15px rgba(249, 115, 22, 0.25));
            animation: treeFloat 5s ease-in-out infinite, logoGlowPulse 8s ease-in-out infinite;
            transition: transform 0.3s ease, filter 0.3s ease;
            display: block;
        }

        .brand-logo:hover {
            transform: translateY(-2px) scale(1.05);
            filter: drop-shadow(0 12px 25px rgba(16, 185, 129, 0.45));
        }

        @keyframes treeFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes logoGlowPulse {
            0%, 100% { filter: drop-shadow(0 4px 15px rgba(249, 115, 22, 0.35)); }
            25% { filter: drop-shadow(0 4px 20px rgba(234, 179, 8, 0.4)); }
            50% { filter: drop-shadow(0 4px 20px rgba(16, 185, 129, 0.55)); }
            75% { filter: drop-shadow(0 4px 20px rgba(6, 182, 212, 0.45)); }
        }

        .brand-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(120deg, #f97316 0%, #eab308 25%, #10b981 50%, #06b6d4 75%, #f97316 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
            animation: shineGradient 5s linear infinite;
        }

        @keyframes shineGradient {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .brand-subtitle {
            font-size: 13.5px;
            color: #64748b;
            font-weight: 500;
        }

        form {
            width: 100%;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 7px;
            letter-spacing: 0.01em;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            color: #0f172a;
            outline: none;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12), inset 0 1px 2px rgba(0,0,0,0.01);
        }

        .input-password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .input-password-wrapper input {
            padding-right: 85px;
        }

        .btn-toggle-pass {
            position: absolute;
            right: 8px;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #475569;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s;
            user-select: none;
        }

        .btn-toggle-pass * {
            pointer-events: none;
        }

        .btn-toggle-pass:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 26px;
            font-size: 13px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #475569;
            cursor: pointer;
            user-select: none;
        }

        .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #2563eb;
            border-radius: 4px;
            cursor: pointer;
        }

        .forgot-password {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-password:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        .btn-primary-login {
            width: 100%;
            padding: 15px;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            background: #2563eb;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-primary-login:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .login-error-banner {
            display: none;
            background-color: #fef2f2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
            align-items: center;
            gap: 10px;
            animation: shakeError 0.4s ease-in-out;
        }

        .login-error-banner.active {
            display: flex;
        }

        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .login-footer {
            margin-top: 32px;
            text-align: center;
            font-size: 13.5px;
            color: #64748b;
            border-top: 1px solid #f1f5f9;
            padding-top: 24px;
        }

        .login-footer a {
            color: #10b981;
            font-weight: 700;
            text-decoration: none;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 900px) {
            body, html {
                height: auto;
                min-height: 100vh;
                overflow-x: hidden !important;
                overflow-y: auto !important;
            }
            .visual-side { display: none; }
            .login-side {
                width: 100%;
                min-height: 100vh;
                box-shadow: none;
                border-left: none;
                padding: 36px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Lado Esquerdo: Canvas Aurora -->
    <div class="visual-side">
        <canvas id="aurora-canvas"></canvas>
        <div class="visual-overlay-text">
            <h2>Gestão Inteligente & Esporte</h2>
            <p>Conectando atletas, projetos e comunidades em uma plataforma integrada de alta performance.</p>
        </div>
    </div>

    <!-- Lado Direito: Formulário de Login Central -->
    <div class="login-side">
        <div class="brand-header">
            <img class="brand-logo" src="logo_integra.png" onerror="this.onerror=null; this.src='http://3.141.142.62:8000/storage/v1/object/public/INTEGRA/logo_integra.png';" alt="INTEGRA">
            <h1 class="brand-title">INTEGRA</h1>
            <p class="brand-subtitle">Plataforma Unificada de Gestão</p>
        </div>

        <div id="login-error-msg" class="login-error-banner">
            <svg style="width:18px;height:18px;fill:currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <span id="login-error-text">Credenciais inválidas. Verifique seus dados.</span>
        </div>

        <form id="form-login-integra">
            <div class="form-group">
                <label for="usernameInput">E-mail ou Celular</label>
                <input type="text" id="usernameInput" class="form-control" placeholder="seuemail@dominio.com ou (00) 00000-0000" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="passwordInput">Senha</label>
                <div class="input-password-wrapper">
                    <input type="password" id="passwordInput" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="btn-toggle-pass" id="btnTogglePassLogin">
                        <i data-lucide="eye"></i> Ver
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    Lembrar acesso
                </label>
                <a href="#" class="forgot-password" onclick="alert('Entre em contato com a coordenação do seu projeto para redefinir sua senha.'); return false;">Esqueceu sua senha?</a>
            </div>

            <button type="submit" id="btnSubmitLogin" class="btn-primary-login">Entrar no Sistema</button>
        </form>

        <div class="login-footer">
            Deseja se matricular em um projeto? <a href="https://gasctpna.plataformaintegra.com.br/">Criar Acesso GASCTPNA</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('aurora-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];

        function resize() {
            width = canvas.width = canvas.offsetWidth;
            height = canvas.height = canvas.offsetHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class BlobParticle {
            constructor(x, y, radius, color, vx, vy) {
                this.x = x; this.y = y; this.radius = radius;
                this.color = color; this.vx = vx; this.vy = vy;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x - this.radius < 0 || this.x + this.radius > width) this.vx *= -1;
                if (this.y - this.radius < 0 || this.y + this.radius > height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                gradient.addColorStop(0, this.color);
                gradient.addColorStop(1, 'rgba(6, 10, 19, 0)');
                ctx.fillStyle = gradient;
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initAurora() {
            particles = [
                new BlobParticle(width * 0.3, height * 0.3, 350, 'rgba(249, 115, 22, 0.25)', 0.4, 0.3),
                new BlobParticle(width * 0.7, height * 0.6, 400, 'rgba(16, 185, 129, 0.22)', -0.3, 0.4),
                new BlobParticle(width * 0.5, height * 0.8, 380, 'rgba(6, 182, 212, 0.20)', 0.3, -0.3)
            ];
        }

        function animate() {
            ctx.fillStyle = '#060a13';
            ctx.fillRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        initAurora();
        animate();
        if (window.lucide) lucide.createIcons();
    </script>

    <script>
        const loginForm = document.getElementById('form-login-integra');
        const usernameInput = document.getElementById('usernameInput');
        const passwordInput = document.getElementById('passwordInput');
        const btnSubmit = document.getElementById('btnSubmitLogin');
        const loginErrorMsg = document.getElementById('login-error-msg');
        const loginErrorText = document.getElementById('login-error-text');

        const btnTogglePass = document.getElementById('btnTogglePassLogin');
        if (btnTogglePass && passwordInput) {
            btnTogglePass.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                const isPass = passwordInput.type === 'password';
                passwordInput.type = isPass ? 'text' : 'password';
                btnTogglePass.innerHTML = isPass 
                    ? '<i data-lucide="eye-off"></i> Ocultar' 
                    : '<i data-lucide="eye"></i> Ver';
                if (window.lucide) lucide.createIcons();
            });
        }

        function showLoginError(message) {
            if (loginErrorMsg && loginErrorText) {
                loginErrorText.textContent = message;
                loginErrorMsg.classList.add('active');
            }
        }

        function hideLoginError() {
            if (loginErrorMsg) {
                loginErrorMsg.classList.remove('active');
            }
        }

        [usernameInput, passwordInput].forEach(inp => {
            if (inp) inp.addEventListener('input', () => hideLoginError());
        });

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i].trim();
                if (c.indexOf(nameEQ) === 0) return decodeURIComponent(c.substring(nameEQ.length, c.length));
            }
            return '';
        }

        const savedEmail = localStorage.getItem('usuario_email') || getCookie('usuario_email');
        const savedSenha = localStorage.getItem('usuario_senha') || getCookie('usuario_senha');
        if (savedEmail && savedSenha && window.location.search.includes('autologin=true')) {
            usernameInput.value = savedEmail;
            passwordInput.value = savedSenha;
        }

        if (loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const username = usernameInput.value.trim();
                const password = passwordInput.value;

                if (!username || !password) {
                    showLoginError('Por favor, preencha o e-mail/celular e a senha.');
                    return;
                }

                hideLoginError();
                btnSubmit.disabled = true;
                btnSubmit.textContent = 'Autenticando...';

                try {
                    const url = `https://w.ibrase.com.br/webhook/loginaluno?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
                    const res = await fetch(url);
                    const text = await res.text();
                    const respText = text.trim().toLowerCase();

                    if (respText.includes('login aprovado') || respText.includes('aprovado')) {
                        hideLoginError();
                        btnSubmit.textContent = 'Sucesso! Entrando...';
                        btnSubmit.style.background = '#10b981';

                        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
                        let uNome = '', uTelefone = '', uEmail = username.toLowerCase(), uId = '', uDados = '';

                        let emailIdx = lines.findIndex(l => l.includes('@'));
                        if (emailIdx !== -1) {
                            uEmail = lines[emailIdx].toLowerCase();
                            if (emailIdx >= 2) { uNome = lines[emailIdx - 2]; uTelefone = lines[emailIdx - 1]; }
                            else if (emailIdx === 1) { uNome = lines[0]; }
                            if (lines[emailIdx + 1]) uId = lines[emailIdx + 1];
                        } else {
                            if (lines.length >= 2) uNome = lines[1];
                            if (lines.length >= 3) uTelefone = lines[2];
                            if (lines.length >= 4) uEmail = lines[3].toLowerCase();
                            if (lines.length >= 5) uId = lines[4];
                        }

                        const startBracket = text.indexOf('[');
                        const startBrace = text.indexOf('{');
                        let jsonStart = -1;
                        if (startBracket !== -1 && startBrace !== -1) jsonStart = Math.min(startBracket, startBrace);
                        else if (startBracket !== -1) jsonStart = startBracket;
                        else if (startBrace !== -1) jsonStart = startBrace;

                        if (jsonStart !== -1) uDados = text.substring(jsonStart).trim();
                        else if (lines.length > 5) uDados = lines.slice(5).join('\n');

                        if (/^\d+$/.test(uNome)) {
                            if (!uTelefone || /^\d+$/.test(uTelefone)) uTelefone = uNome;
                            uNome = '';
                        }

                        let uPrimeiroNome = uNome ? uNome.split(' ')[0] : '';
                        if (uPrimeiroNome) {
                            uPrimeiroNome = uPrimeiroNome.charAt(0).toUpperCase() + uPrimeiroNome.slice(1).toLowerCase();
                        }

                        function setCookie(name, val, days = 30) {
                            const d = new Date();
                            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
                            let domainAttr = '';
                            if (window.location.hostname.includes('plataformaintegra.com.br') || window.location.hostname.includes('portalintegra.com.br')) {
                                const baseDomain = window.location.hostname.replace(/^www\./, '');
                                domainAttr = `;domain=.${baseDomain}`;
                            }
                            document.cookie = `${name}=${encodeURIComponent(val)};expires=${d.toUTCString()};path=/${domainAttr};SameSite=Lax`;
                        }

                        if (uNome) { localStorage.setItem('usuario_nome', uNome); setCookie('usuario_nome', uNome); }
                        if (uPrimeiroNome) { localStorage.setItem('usuario_primeiro_nome', uPrimeiroNome); setCookie('usuario_primeiro_nome', uPrimeiroNome); }
                        if (uTelefone) { localStorage.setItem('usuario_telefone', uTelefone); setCookie('usuario_telefone', uTelefone); }
                        if (uEmail) {
                            localStorage.setItem('usuario_email', uEmail);
                            localStorage.setItem('email_conta', uEmail);
                            setCookie('usuario_email', uEmail);
                            setCookie('email_conta', uEmail);
                        }
                        if (password) {
                            localStorage.setItem('usuario_senha', password);
                            setCookie('usuario_senha', password);
                        }
                        if (uId) { localStorage.setItem('usuario_id', uId); setCookie('usuario_id', uId); }
                        if (uDados) { localStorage.setItem('usuario_dados', uDados); setCookie('usuario_dados', uDados); }

                        // Redirecionamento limpo para a Área do Aluno
                        let targetUrl = 'area_aluno';
                        if (window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname.includes('vercel.app')) {
                            targetUrl = 'area_aluno.html';
                        }

                        window.location.href = targetUrl;
                    } else if (respText.includes('senha incorreta')) {
                        showLoginError('Senha incorreta. Por favor, verifique sua senha e tente novamente.');
                        btnSubmit.disabled = false;
                        btnSubmit.textContent = 'Entrar no Sistema';
                        passwordInput.focus();
                        passwordInput.select();
                    } else if (respText.includes('não existe') || respText.includes('nao existe')) {
                        showLoginError('Este e-mail/celular não está cadastrado no sistema.');
                        btnSubmit.disabled = false;
                        btnSubmit.textContent = 'Entrar no Sistema';
                        usernameInput.focus();
                        usernameInput.select();
                    } else {
                        showLoginError('Não foi possível realizar o login. Verifique seus dados.');
                        btnSubmit.disabled = false;
                        btnSubmit.textContent = 'Entrar no Sistema';
                    }
                } catch (err) {
                    console.error('Erro de requisição login:', err);
                    showLoginError('Erro de conexão ao servidor de autenticação.');
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Entrar no Sistema';
                }
            });
        }

        // Auto-login automático ao vir do site de Criar Acesso (via URL query params)
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const userParam = urlParams.get('username') || urlParams.get('email') || urlParams.get('usuario') || urlParams.get('celular');
            const passParam = urlParams.get('password') || urlParams.get('senha') || urlParams.get('pass');

            if (userParam && usernameInput) usernameInput.value = userParam;
            if (passParam && passwordInput) passwordInput.value = passParam;

            if (userParam && passParam && loginForm) {
                console.log('Executando auto-login para conta recém-criada...');
                setTimeout(() => {
                    if (typeof loginForm.requestSubmit === 'function') {
                        loginForm.requestSubmit();
                    } else {
                        loginForm.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
                    }
                }, 300);
            }
        });
    </script>
</body>
</html>
