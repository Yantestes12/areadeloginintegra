<!DOCTYPE html>
<html lang="pt-br" class="light">
<head>
  <meta charset="UTF-8">
  <title>Área do Participante — INTEGRA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Favicon & Ícone da Aba -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=3">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png?v=3">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=3">
  <link rel="apple-touch-icon" href="favicon-192.png?v=3">

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="INTEGRA">
  <meta name="theme-color" content="#003fa3">
  <meta name="description" content="Área do Participante — INTEGRA Plataforma Unificada">
  <meta property="og:title" content="Área do Participante — INTEGRA">
  <meta property="og:description" content="Painel de controle e área do aluno.">
  <meta property="og:image" content="https://portalintegra.com.br/logo_integra.png">
  <meta property="og:url" content="https://portalintegra.com.br/area_aluno">
  <meta property="og:type" content="website">

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary: #003fa3;
      --primary-container: #0055d4;
      --primary-gradient: linear-gradient(135deg, #003fa3 0%, #5800c7 100%);
      --secondary: #00696b;
      --secondary-container: #56f5f8;
      --on-secondary-container: #004f51;
      --tertiary: #5800c7;
      --background: #f9f9ff;
      --surface: #ffffff;
      --surface-container-low: #f1f3ff;
      --surface-container: #e9edff;
      --on-surface: #001a41;
      --on-surface-variant: #424654;
      --outline-variant: #c3c6d7;
      --font-main: 'Montserrat', system-ui, -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100vh; }
    body {
      font-family: var(--font-main);
      background-color: var(--background);
      color: var(--on-surface);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Navbar Header */
    .header-bar {
      width: 100%;
      height: 80px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--outline-variant);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .brand-logo img {
      height: 38px;
      width: auto;
      object-fit: contain;
      border-radius: 6px;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.02em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .user-profile-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
    }
    .user-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary-gradient);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      border: 2.5px solid #ffffff;
      box-shadow: 0 4px 12px rgba(0, 63, 163, 0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .user-avatar:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 16px rgba(0, 63, 163, 0.3);
    }

    .user-details {
      text-align: right;
    }
    .user-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--on-surface);
      line-height: 1.2;
    }
    .user-sub {
      font-size: 11.5px;
      color: var(--on-surface-variant);
      font-weight: 600;
    }

    .btn-logout {
      background: var(--surface-container-low);
      border: 1px solid var(--outline-variant);
      color: var(--on-surface);
      padding: 9px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-logout:hover {
      background: #ffeeee;
      border-color: #ffcdd2;
      color: #d32f2f;
    }

    /* Main Container */
    .main-wrapper {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px 48px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* Greeting Section */
    .greeting-section h1 {
      font-size: 34px;
      font-weight: 900;
      color: var(--on-surface);
      margin: 0 0 6px;
      letter-spacing: -0.03em;
    }
    .greeting-section p {
      font-size: 16px;
      color: var(--on-surface-variant);
      margin: 0;
      font-weight: 500;
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }

    /* Fazer Matrícula Card */
    .card-action-primary {
      background: var(--primary-gradient);
      border-radius: 28px;
      padding: 32px;
      color: #ffffff;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 240px;
      box-shadow: 0 10px 28px rgba(0, 63, 163, 0.25);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      border: none;
      text-align: left;
    }
    .card-action-primary:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 36px rgba(0, 63, 163, 0.35);
    }
    .card-icon-box-white {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.15);
    }
    .card-title-lg {
      font-size: 26px;
      font-weight: 800;
      margin: 0 0 6px;
      letter-spacing: -0.02em;
    }
    .card-action-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0.9;
    }

    /* Consultar Matrículas Card */
    .card-action-secondary {
      background: var(--surface);
      border: 1.5px solid var(--outline-variant);
      border-radius: 28px;
      padding: 32px;
      color: var(--on-surface);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 240px;
      box-shadow: 0 4px 16px rgba(0, 26, 65, 0.04);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      cursor: pointer;
      border: none;
      text-align: left;
    }
    .card-action-secondary:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0, 26, 65, 0.08);
      border-color: var(--primary-container);
    }
    .card-icon-box-cyan {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: var(--secondary-container);
      color: var(--on-secondary-container);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(86, 245, 248, 0.35);
    }

    /* Results Section */
    .results-section {
      background: var(--surface);
      border-radius: 24px;
      border: 1.5px solid var(--outline-variant);
      padding: 28px;
      box-shadow: 0 6px 20px rgba(0, 26, 65, 0.03);
    }
    .results-header {
      font-size: 20px;
      font-weight: 800;
      color: var(--on-surface);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .matricula-card-item {
      background: var(--background);
      border: 1px solid var(--outline-variant);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .matricula-info h3 {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
      margin: 0 0 6px;
    }
    .matricula-meta {
      font-size: 13.5px;
      color: var(--on-surface-variant);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-weight: 600;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 800;
    }

    .btn-action-sm {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-pdf {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(0, 63, 163, 0.2);
    }
    .btn-pdf:hover {
      background: var(--primary-container);
      transform: translateY(-1px);
    }
    .btn-details {
      background: #ffffff;
      border: 1px solid var(--outline-variant);
      color: var(--on-surface);
    }
    .btn-details:hover {
      background: var(--surface-container-low);
    }

    /* Modals */
    .al-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 26, 65, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .al-modal {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 24px 48px rgba(0, 26, 65, 0.2);
      max-height: 90vh;
      overflow-y: auto;
    }
    .al-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--outline-variant);
    }
    .al-modal-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--on-surface-variant);
    }
    .al-btn-tb {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      border-radius: 14px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      background: var(--primary-gradient);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(0, 63, 163, 0.25);
    }

    /* Footer */
    footer.app-footer {
      width: 100%;
      padding: 28px 24px;
      text-align: center;
      background: var(--surface-container-low);
      border-top: 1px solid var(--outline-variant);
      font-size: 13px;
      color: var(--on-surface-variant);
      font-weight: 600;
      margin-top: auto;
    }

    @media (max-width: 640px) {
      .header-bar { padding: 0 16px; height: 72px; }
      .main-wrapper { padding: 20px 16px 36px; gap: 24px; }
      .greeting-section h1 { font-size: 26px; }
      .card-action-primary, .card-action-secondary { padding: 24px; min-height: 200px; border-radius: 24px; }
      .user-details { display: none; }
    }
  </style>
</head>
<body>

  <!-- Top Navbar Header -->
  <header class="header-bar">
    <a href="area_aluno.html" class="brand-logo">
      <img src="logo_integra_simbolo.gif" onerror="this.onerror=null; this.src='logo_integra.png';" alt="INTEGRA" style="height:38px;">
      <span class="brand-title" style="margin-left:6px;">Integra</span>
    </a>
    <div class="header-right">
      <div class="user-profile-btn" >
        <div class="user-details">
          <div class="user-name" id="display-topbar-name">Aluno Cadastrado</div>
          <div class="user-sub">Painel do Aluno</div>
        </div>
        <div class="user-avatar" id="display-avatar-icon">P</div>
      </div>
      <button type="button" class="btn-logout" onclick="logout()">Sair</button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-wrapper">
    <!-- Greeting Header -->
    <section class="greeting-section">
      <h1 id="display-welcome-title">Olá, Participante!</h1>
      <p>Bem-vindo(a) ao seu Painel do Aluno GASCTPNA</p>

      <div style="margin-top:14px;display:inline-flex;align-items:center;gap:12px;background:#ffffff;border:1px solid var(--outline-variant);border-radius:14px;padding:10px 18px;box-shadow:0 4px 14px rgba(0,26,65,0.03);">
        <img src="logo_gasctpna.jpg" onerror="this.src='logo_integra.png';" style="height:34px;width:auto;object-fit:contain;border-radius:6px;">
        <div style="font-size:13px;font-weight:800;color:var(--on-surface);letter-spacing:0.03em;">GASCTPNA</div>
      </div>
    </section>

    <!-- Action Cards Grid -->
    <section class="cards-grid">
      <!-- Card Fazer Matrícula -->
      <button class="card-action-primary" onclick="window.location.href='matricula.html'">
        <div class="card-icon-box-white">
          <span class="material-symbols-outlined" style="font-size:36px;font-variation-settings:'FILL' 1;">rocket_launch</span>
        </div>
        <div>
          <h2 class="card-title-lg">Fazer Matrícula</h2>
          <div class="card-action-label">
            <span>Iniciar Novo Processo</span>
            <span class="material-symbols-outlined" style="font-size:18px;">arrow_forward</span>
          </div>
        </div>
      </button>

      <!-- Card Consultar Minha Matrícula -->
      <button class="card-action-secondary" onclick="consultarMatriculaPorID()">
        <div class="card-icon-box-cyan">
          <span class="material-symbols-outlined" style="font-size:36px;font-variation-settings:'FILL' 1;">manage_search</span>
        </div>
        <div>
          <h2 class="card-title-lg">Consultar Minha Matrícula</h2>
          <div class="card-action-label" style="color:var(--primary);">
            <span>Buscar Ficha por ID</span>
            <span class="material-symbols-outlined" style="font-size:18px;">east</span>
          </div>
        </div>
      </button>
    </section>

    <!-- Dynamic Matrículas Container -->
    <section class="results-section" id="results-container" style="display:none;">
      <div class="results-header">
        <span class="material-symbols-outlined" style="color:var(--primary);">folder_shared</span>
        <span>Suas Matrículas Cadastradas</span>
      </div>
      <div id="matriculas-list-body">
        <!-- Preenchido via JS -->
      </div>
    </section>
  </main>



  <!-- Modal Ficha de Dados do Aluno -->
  <div class="al-modal-overlay" id="dadosModalOverlay" onclick="closeDadosModal()" style="display:none">
    <div class="al-modal" onclick="event.stopPropagation()" style="max-width:540px;">
      <div class="al-modal-header">
        <strong style="display:flex;align-items:center;gap:8px;font-size:17px;color:var(--primary);">
          <i data-lucide="file-text"></i> Meus Dados Cadastrados
        </strong>
        <button type="button" class="al-modal-close" onclick="closeDadosModal()">×</button>
      </div>
      <div class="al-modal-body" id="dadosModalContent">
        <!-- Preenchido via JS -->
      </div>
    </div>
  </div>

  <!-- App Footer -->
  <footer class="app-footer">
    © 2026 Plataforma Integra — Grupo de Apoio Social aos Cultivadores da Terra e Preservação da Natureza (GASCTPNA)
  </footer>

  <script>
    if (window.lucide) { lucide.createIcons(); }

    function openAvatarModal_disabled() {
      var overlay = document.getElementById('avatarModalOverlay');
      var container = document.getElementById('pwa-install-container');
      var btnTrigger = document.getElementById('btn-pwa-trigger');
      if (overlay) overlay.style.display = 'flex';
      
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      var isAndroid = /Android/.test(navigator.userAgent);
      
      if (isIOS) {
        if (container) {
          container.innerHTML = '<div style="background:#f0fdf4;border:1.5px solid #86efac;border-radius:14px;padding:16px;text-align:left;">'
            + '<div style="font-weight:800;color:#166534;font-size:14px;margin-bottom:8px;">📱 Como instalar no iPhone (Safari):</div>'
            + '<ol style="margin:0;padding-left:20px;font-size:13px;color:#15803d;line-height:1.5;">'
            + '<li>Toque no ícone de <strong>Compartilhar</strong> (📤 na barra inferior do Safari).</li>'
            + '<li>Role as opções e toque em <strong>"Adicionar à Tela de Início"</strong> (➕).</li>'
            + '<li>Toque em <strong>Adicionar</strong> no canto superior.</li>'
            + '</ol></div>';
        }
        if (btnTrigger) btnTrigger.style.display = 'none';
      } else if (isAndroid) {
        if (container) {
          container.innerHTML = '<div style="background:#f0fdf4;border:1.5px solid #86efac;border-radius:14px;padding:16px;text-align:left;">'
            + '<div style="font-weight:800;color:#166534;font-size:14px;margin-bottom:8px;">🤖 Instalar no Android (Chrome):</div>'
            + '<p style="font-size:13px;color:#15803d;margin:0;line-height:1.4;">'
            + 'Clique no botão abaixo ou toque nos <strong>3 pontinhos (⋮)</strong> no canto do seu navegador e escolha <strong>"Instalar aplicativo"</strong> ou <strong>"Adicionar à tela inicial"</strong>.'
            + '</p></div>';
        }
        if (btnTrigger) btnTrigger.style.display = 'block';
      } else {
        if (container) {
          container.innerHTML = '<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:16px;text-align:center;">'
            + '<p style="font-size:13px;color:#475569;margin:0;">'
            + 'Acesse esta página pelo navegador do seu celular (Android ou iPhone) para instalar o aplicativo direto na tela inicial!'
            + '</p></div>';
        }
        if (btnTrigger) btnTrigger.style.display = 'block';
      }
    }

    function closeAvatarModal() {
      var overlay = document.getElementById('avatarModalOverlay');
      if (overlay) overlay.style.display = 'none';
    }
    function closeDadosModal() {
      var overlay = document.getElementById('dadosModalOverlay');
      if (overlay) overlay.style.display = 'none';
    }

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
    });

    function dispararInstalacaoPWA_disabled() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(choiceResult) {
          if (choiceResult.outcome === 'accepted') {
            alert('Aplicativo INTEGRA instalado com sucesso!');
          }
          deferredPrompt = null;
        });
      } else {
        alert("No seu navegador, toque no menu de opções (⋮ ou 📤) e escolha 'Adicionar à tela inicial'.");
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = 'login';
    }

    function getCookie(name) {
      const nameEQ = name + "=";
      const ca = document.cookie.split(';');
      for(let i = 0; i < ca.length; i++) {
        let c = ca[i].trim();
        if (c.indexOf(nameEQ) === 0) return decodeURIComponent(c.substring(nameEQ.length, c.length));
      }
      return '';
    }

    function getStoredVal(key) {
      return localStorage.getItem(key) || getCookie(key) || '';
    }

    function setCookie(name, val, days = 30) {
      const d = new Date();
      d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
      let domainAttr = '';
      if (window.location.hostname.includes('plataformaintegra.com.br')) {
        domainAttr = ';domain=.plataformaintegra.com.br';
      }
      document.cookie = `${name}=${encodeURIComponent(val)};expires=${d.toUTCString()};path=/${domainAttr};SameSite=Lax`;
    }

    let currentMatriculasList = [];
    let currentMatriculaItem = null;

    async function consultarMatriculaPorID() {
      const resultsContainer = document.getElementById('results-container');
      const listBody = document.getElementById('matriculas-list-body');

      if (resultsContainer) resultsContainer.style.display = 'block';
      if (listBody) {
        listBody.innerHTML = '<div style="text-align:center;padding:32px;color:var(--on-surface-variant);font-weight:600;">⏳ Buscando dados da matrícula...</div>';
      }

      const uId = getStoredVal('usuario_id');
      const uEmail = getStoredVal('usuario_email') || getStoredVal('email_conta');
      const uTel = getStoredVal('usuario_telefone');
      const uCpf = getStoredVal('usuario_cpf');

      let items = [];

      // 1. Tentar ler as matrículas armazenadas localmente na sessão do login
      try {
        const rawDados = getStoredVal('usuario_dados');
        if (rawDados) {
          let parsed = typeof rawDados === 'string' ? JSON.parse(rawDados) : rawDados;
          if (Array.isArray(parsed)) {
            if (parsed[0] && Array.isArray(parsed[0].matriculas)) items = parsed[0].matriculas;
            else if (parsed[0] && Array.isArray(parsed[0].projetos_inscritos)) items = parsed[0].projetos_inscritos;
            else items = parsed;
          } else if (parsed && typeof parsed === 'object') {
            if (Array.isArray(parsed.matriculas)) items = parsed.matriculas;
            else if (Array.isArray(parsed.projetos_inscritos)) items = parsed.projetos_inscritos;
            else if (parsed.id) items = [parsed];
          }
        }
      } catch(e){}

      // 2. Se não houver matrículas locais, consultar o webhook por ID / Email / Tel / CPF
      if (items.length === 0) {
        if (uId || uEmail || uTel || uCpf) {
          try {
            let queryParams = [];
            if (uId) queryParams.push('id=' + encodeURIComponent(uId));
            if (uEmail) queryParams.push('email=' + encodeURIComponent(uEmail));
            if (uTel) queryParams.push('telefone=' + encodeURIComponent(uTel));
            if (uCpf) queryParams.push('cpf=' + encodeURIComponent(uCpf));

            const url = 'https://w.ibrase.com.br/webhook/consultarmatriculasaluno?' + queryParams.join('&');
            const resp = await fetch(url);
            if (resp.ok) {
              const data = await resp.json();
              let fetched = Array.isArray(data) ? data : (data.matriculas || data.dados || []);
              if (Array.isArray(fetched) && fetched.length > 0) {
                items = fetched;
              }
            }
          } catch(err) {
            console.warn('Erro ao consultar webhook de matrículas:', err);
          }
        }
      }

      currentMatriculasList = items;

      if (items.length === 0) {
        if (listBody) {
          listBody.innerHTML = `
            <div style="text-align:center;padding:32px;color:var(--on-surface-variant);">
              <div style="font-size:32px;margin-bottom:8px;">📄</div>
              <div style="font-weight:700;font-size:15px;color:var(--on-surface);">Nenhuma ficha de matrícula localizada</div>
              <div style="font-size:13px;margin-top:4px;color:var(--on-surface-variant);">Se você ainda não realizou sua inscrição, clique em <strong>Fazer Matrícula</strong> para se cadastrar.</div>
            </div>
          `;
        }
        return;
      }

      currentMatriculaItem = items[0];

      let html = '';
      items.forEach((item, idx) => {
        const nomeProj = item.projeto_nome || item.nome_projeto || item.projeto || 'GASCTPNA';
        const nucNome = item.nucleo_nome || item.bairro || 'Polo Central';
        const matId = item.id || uId || (idx + 1);

        html += `
          <div class="matricula-card-item">
            <div class="matricula-info">
              <h3>Matrícula #${matId} — ${nomeProj}</h3>
              <div class="matricula-meta">
                <span>📍 Núcleo: ${nucNome}</span>
                <span>🗓️ Turno: ${item.turno || 'Vespertino'}</span>
                <span class="status-badge">🟢 Matrícula Ativa</span>
              </div>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              <button type="button" class="btn-action-sm btn-pdf" onclick="baixarComprovanteInscricao(${idx})">
                <span class="material-symbols-outlined" style="font-size:18px;">print</span> Baixar Ficha PDF
              </button>
            </div>
          </div>
        `;
      });

      if (listBody) listBody.innerHTML = html;
    })();
  </script>
</body>
</html>
